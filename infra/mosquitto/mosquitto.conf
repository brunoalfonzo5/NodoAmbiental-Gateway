# ======================================
# NODO AMBIENTAL - SERVIDOR MQTT
# ======================================

# Puerto de escucha MQTT
listener 1883 0.0.0.0

# Seguridad
allow_anonymous false

# Archivo de usuarios y contraseñas
password_file /mosquitto/data/passwords

# Persistencia
persistence true
persistence_location /mosquitto/data/

#Registros del broker
log_dest stdout